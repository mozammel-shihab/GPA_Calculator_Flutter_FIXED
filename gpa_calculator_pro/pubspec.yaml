name: gpa_calculator_pro
description: A complete Flutter GPA and CGPA calculator for students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
